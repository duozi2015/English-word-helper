# 背单词应用 nginx 配置片段（words.conf）
#
# 使用方式二选一：
#   方案 A（推荐，与错题本同域名 2530 共存）：把下方「A. location 片段」并入
#     /opt/homebrew/etc/nginx/servers/ 中现有的 2530 server 块（server {} 内）。
#     本应用全部走 /words/ 前缀，与错题本的 location /api/ 天然隔离，无冲突。
#   方案 B（独立端口，完全不动现有 conf）：启用下方「B. 独立 server 块」整段，
#     另存为 /opt/homebrew/etc/nginx/servers/words.conf，监听 2531。
#
# 改完执行：nginx -t && nginx -s reload
#   （Homebrew 版可用绝对路径：/opt/homebrew/opt/nginx/bin/nginx -s reload）
#
# 关键事实（写配置前确认过的）：
# - 前端 vite 已配 base: '/words/'，构建产物内资源路径均为 /words/assets/...
# - 后端 FastAPI 路由全部挂在 /words/api/*（错题本占用裸 /api/，故用此前缀避让）
# - proxy_pass 结尾不带 URI → 原始路径 /words/api/... 原样转发，无需 rewrite
# - 健康检查端点在裸 /health（无 /words/api 前缀）


# ═══════════════════════════════════════════════════════
# A. location 片段 —— 并入现有 2530 server 块内（推荐）
# ═══════════════════════════════════════════════════════

# SPA 静态资源（React Router history 路由）：
#   ⚠️ 不用 alias + try_files 组合 —— 回退 URI /words/index.html 会被 alias 再次映射成
#   dist/words/index.html（不存在）→ 内部重定向循环 → 500。
#   改用 root 方案：deploy.sh 已建 webroot/words → dist 的符号链接，
#   URI /words/xxx 直接落到 webroot/words/xxx，回退 /words/index.html 也能正确命中。
#   假设 server 块的 server_name/端口由现有配置决定，将下方 root 放入 location：
location /words/ {
    root /Users/doudou_files/claude/English-word-helper/app/frontend/webroot;
    try_files $uri $uri/ /words/index.html;
}

# 反向代理到背单词后端（8001）：
#   proxy_pass 不带末尾 / —— 保留 /words/api/ 前缀原样转发，后端路由即挂在该前缀下
location /words/api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
}

# 可选：通过 nginx 暴露健康检查（后端端点在裸 /health，需精确匹配改写）
# location = /words/health { proxy_pass http://127.0.0.1:8001/health; }


